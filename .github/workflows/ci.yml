name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 测试只读源码；不注入模型密钥、不发布包，也不保留 Git 写入凭据。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Checks (Node 24 / macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # 项目没有外部依赖或锁文件，不运行会直接失败的 npm ci。
      - name: Run unit and package tests
        id: tests
        run: >-
          npm test --
          --test-reporter=spec --test-reporter=junit
          --test-reporter-destination=stdout
          --test-reporter-destination=test-results.xml

      - name: Upload test report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Compile native capture helper
        run: >-
          xcrun swiftc -swift-version 5 -O
          -module-cache-path "$RUNNER_TEMP/swift-module-cache"
          native/capture.swift -o "$RUNNER_TEMP/screen-trail-capture"

      # 只走内置自测分支，不录屏、不改变屏幕状态，也不请求录屏授权。
      - name: Run native self-tests
        run: |
          "$RUNNER_TEMP/screen-trail-capture" --self-test
          "$RUNNER_TEMP/screen-trail-capture" --self-test-screen-events
          "$RUNNER_TEMP/screen-trail-capture" --self-test-screen-check

      - name: Create installable package
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist

      - name: Upload plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-trail-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
