# dsh bundle patch: inserts this plugin into a profile's layer stack.
- insert:
    - id: screen-trail
      name: '@local/dsh-screen-trail'
      config:
        sampleIntervalSec: 5
        analysisWindowSec: 300
        analysisMaxTokens: 16384
        analysisReasoningEffort: low
        autoStart: false
        retention: 80
